name: macOS tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Shell syntax
        run: |
          for file in install.sh rollback.sh watchdog.sh status.sh bin/killswitch; do
            /bin/sh -n "$file"
          done
      - name: Isolated watchdog and configuration tests
        run: python3 -m unittest discover -s tests -v
